[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civil-unrest-forecasting"
version = "0.1.0"
description = "Civil Unrest Event Extraction and Multi-Horizon Prediction from Social Media & News Data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pranjal Gautam", email = "pranjalofficial32@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "spacy>=3.7.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]
